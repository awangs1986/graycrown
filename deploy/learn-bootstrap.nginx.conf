# Temporary HTTP challenge host; existing virtual hosts are unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name learn.awangsawangs.xyz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / { return 503; }
}
