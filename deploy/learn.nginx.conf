# Dedicated public learning site. Included inside Nginx's http block.
map $uri $graycrown_csp {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    /csharp/runner.worker.js "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src https://learn.awangsawangs.xyz/csharp/; worker-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'";
}

server {
    listen 80;
    listen [::]:80;
    server_name learn.awangsawangs.xyz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / { return 301 https://learn.awangsawangs.xyz$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name learn.awangsawangs.xyz;
    ssl_certificate /etc/letsencrypt/live/learn.awangsawangs.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.awangsawangs.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/graycrown/current;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/graycrown-access.log;
    error_log /var/log/nginx/graycrown-error.log;

    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Content-Security-Policy $graycrown_csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript application/json text/css;
    gzip_min_length 1024;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location ~ /\. { return 404; }
    location ~ \.wav$ {
        default_type audio/wav;
        try_files $uri =404;
    }
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
}
