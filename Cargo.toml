[package]
name = "gray-crown-launcher"
version = "0.2.0"
edition = "2024"
description = "Self-contained local launcher and JSON save service for Ash Crown"
license = "MIT"

[dependencies]
mime_guess = "2.0"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
webbrowser = "1.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
