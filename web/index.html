<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Independent learning adventures in C, C# and French." />
  <title>Gray Crown · Courses</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./library.css" />
</head>
<body>
  <main id="library" class="course-library">
    <header class="library-header">
      <span class="library-brand">♛ Gray Crown</span>
      <button id="libraryLanguage" class="language-toggle" type="button">中文</button>
    </header>
    <p class="eyebrow light" id="libraryEyebrow">YOUR LEARNING ADVENTURES</p>
    <h1 id="libraryTitle">Choose your course</h1>
    <p id="libraryDescription" class="library-description">Each course has its own journey, drafts and progress.</p>
    <div id="courseCards" class="course-cards"></div>
    <footer class="library-actions">
      <button id="exportLibrary" class="ghost-btn light-border" type="button">Export all progress</button>
      <label class="ghost-btn light-border file-label"><span id="importLibraryLabel">Import backup</span><input id="importLibrary" type="file" accept="application/json" hidden /></label>
    </footer>
  </main>
  <nav id="courseNavigation" class="course-navigation" hidden>
    <button id="backToCourses" class="secondary-btn" type="button">← Courses</button>
    <span id="activeCourseTitle"></span>
  </nav>
  <div id="courseRoot" hidden></div>
  <p id="libraryStatus" class="library-status" role="status" hidden></p>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
